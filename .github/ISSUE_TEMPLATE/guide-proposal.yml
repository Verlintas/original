name: Propose a guide
description: Suggest a plain-language guide for a public task.
title: "[Guide] "
labels: ["guide"]
body:
  - type: input
    id: title
    attributes:
      label: Working title
      placeholder: "Understand copyright notices"
    validations:
      required: true
  - type: input
    id: audience
    attributes:
      label: Audience
      placeholder: "Creators, small site owners, students, ..."
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What should the reader be able to do?
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Primary sources
      description: Link the official texts the guide should depend on.
    validations:
      required: true
  - type: textarea
    id: draft
    attributes:
      label: Draft or outline
      description: A short outline is enough.
