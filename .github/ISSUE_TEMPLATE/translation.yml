name: Translation
description: Volunteer to translate a guide, checklist, or letter.
title: "[Translation] "
labels: ["translation"]
body:
  - type: input
    id: content
    attributes:
      label: Content to translate
      placeholder: "Guide: Choose a license"
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Target language
      placeholder: "Chinese (Simplified)"
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: Relevant experience
      description: Optional. A sample or a link to previous work helps.
  - type: checkboxes
    id: agreement
    attributes:
      label: Agreement
      options:
        - label: I will keep the English source linked and preserve the disclaimer.
          required: true
